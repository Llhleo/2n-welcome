name: Inject Challenge Secret

on:
  push:
    branches: [ main ]

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace placeholder
        run: |
          sed -i "s/__CHALLENGE_SECRET__/${{ secrets.CHALLENGE_SECRET }}/g" main/challenge.js
      - name: Deploy (replace with your deploy method)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add main/challenge.js
          git commit -m "Inject challenge secret" || true
          git push
