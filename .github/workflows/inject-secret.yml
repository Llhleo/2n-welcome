name: Inject Secrets

on:
  push:
    branches: [ main ]

jobs:
  inject:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 消除 Node 20 弃用警告
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # 使用内建令牌获取推送权限
          fetch-depth: 0  # 获取完整历史，以便 git pull

      - name: Replace placeholders
        run: |
          sed -i "s/__CHALLENGE_SECRET__/${{ secrets.CHALLENGE_SECRET }}/g" main/challenge.js
          sed -i "s/__SURVEY_PAT__/${{ secrets.SURVEY_PAT }}/g" main/submit.js

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add main/challenge.js main/submit.js
          # 检查是否有改动，无改动则跳过提交
          git diff --staged --quiet && echo "没有变更，跳过提交" && exit 0
          git commit -m "Inject secrets [skip ci]"
          # 先拉取再推送，避免因远程有新提交而冲突
          git pull --rebase origin main
          git push origin main
