name: Inject Secrets

on:
  push:
    branches: [ main ]

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace all placeholders
        run: |
          # 替换挑战密钥
          sed -i "s/__CHALLENGE_SECRET__/${{ secrets.CHALLENGE_SECRET }}/g" main/challenge.js
          # 替换问卷提交 Token
          sed -i "s/__SURVEY_PAT__/${{ secrets.SURVEY_PAT }}/g" main/submit.js
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add main/challenge.js main/submit.js
          git commit -m "Inject secrets" || true
          git push
