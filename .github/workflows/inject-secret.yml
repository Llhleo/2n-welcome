name: Inject Secrets

on:
  push:
    branches: [ main ]

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 获取完整历史，保证 git pull 能工作

      - name: Replace placeholders
        run: |
          # 确保文件存在
          if [ ! -f main/challenge.js ]; then echo "文件 main/challenge.js 不存在" && exit 1; fi
          if [ ! -f main/submit.js ]; then echo "文件 main/submit.js 不存在" && exit 1; fi
          sed -i "s/__CHALLENGE_SECRET__/${{ secrets.CHALLENGE_SECRET }}/g" main/challenge.js
          sed -i "s/__SURVEY_PAT__/${{ secrets.SURVEY_PAT }}/g" main/submit.js

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add main/challenge.js main/submit.js
          # 没有改动时直接退出
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Inject secrets [skip ci]"
          # 先拉取远程最新，避免冲突
          git pull --rebase origin main
          git push origin main
