<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史通知</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./main/components.css">
  <link rel="stylesheet" id="theme-link" href="./main/theme-light.css">
  <style>
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid #cfdde9;
      border-radius: 30px;
      padding: 8px 22px;
      cursor: pointer;
      font-size: 1rem;
      color: #1e3b4f;
      margin-bottom: 24px;
      transition: 0.15s;
      text-decoration: none;
    }
    .back-btn:hover { background: #e6f0f9; }
    .notice-item {
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .notice-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    .loading-placeholder {
      color: #6a859c;
      text-align: center;
      padding: 40px;
    }
    /* 深色模式适配 */
    @media (prefers-color-scheme: dark) {
      .back-btn { color: #cbd5e1; border-color: #475569; }
      .back-btn:hover { background: #334155; }
      .notice-item { border-bottom-color: #475569; }
      .loading-placeholder { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <!-- 返回按钮动态填充 -->
  <a id="backButton" class="back-btn" href="index.html">
    <i class="fas fa-arrow-left"></i> <span id="backText">返回</span>
  </a>

  <div id="allNoticeContainer"><div class="loading-placeholder">加载中...</div></div>

  <script type="module">
    import * as pipe from './main/pipe.js';
    import { decodeRichText } from './main/decode.js';

    // 根据 pipe 获取语言，并设置页面语言和按钮文字
    const lang = pipe.getUrlParam('lang') || pipe.getLanguage();
    document.documentElement.lang = lang;
    const backBtn = document.getElementById('backButton');
    const backText = document.getElementById('backText');
    if (backBtn && backText) {
      // 构建带语言参数的返回链接
      const query = pipe.buildQueryString({ lang: lang, mode: pipe.getColorMode() });
      backBtn.href = 'index.html' + (query ? '?' + query : '');
      backText.textContent = lang === 'zh' ? '返回' : 'Back';
    }

    // 加载全部通知（渲染逻辑与之前相同）
    async function loadAllNotices() {
      const container = document.getElementById('allNoticeContainer');
      try {
        const indexRes = await fetch('./data/Announcement/index.json');
        if (!indexRes.ok) throw new Error('索引加载失败');
        const fileList = await indexRes.json();
        if (!fileList.length) {
          container.innerHTML = '<div class="loading-placeholder">暂无通知</div>';
          return;
        }
        let html = '';
        for (const file of fileList) {
          const res = await fetch(`./data/Announcement/${file}`);
          if (!res.ok) continue;
          const notice = await res.json();
          html += renderNoticeFull(notice, file);
        }
        container.innerHTML = html || '<div class="loading-placeholder">暂无通知</div>';
      } catch (e) {
        container.innerHTML = '<div class="loading-placeholder">通知加载失败</div>';
      }
    }

    // 工具函数
    function escapeHTML(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function getLocalizedString(raw, lang) {
      if (!raw || typeof raw !== 'string') return '';
      if (!raw.includes('|')) return raw.trim();
      const parts = raw.split('|');
      const left = (parts[0] || '').trim();
      const right = (parts[1] || '').trim();
      return lang === 'zh' ? (left || right) : (right || left);
    }
    function formatTime(filename, lang) {
      if (!filename) return '';
      const match = filename.match(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/);
      if (!match) return filename;
      const [, y, m, d, h, min] = match;
      if (lang === 'zh') return `${y}.${m}.${d} ${h}:${min}`;
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[+m-1]} ${+d}, ${y} ${h}:${min}`;
    }

    function renderNoticeFull(notice, filename) {
      const tag = (notice.tag || '').toLowerCase();
      const titleText = getLocalizedString(notice.title, lang);
      const content = lang === 'zh' ? (notice.zh || '') : (notice.en || notice.zh || '');
      const decodedContent = decodeRichText(content, 14);
      let titleClass = 'notice-title ';
      if (tag === 'important') titleClass += 'notice-title-important';
      else if (tag === 'joke') titleClass += 'notice-title-joke';
      else titleClass += 'notice-title-normal';
      // 历史页面不显示居中？
      const timeStr = formatTime(filename, lang);
      const writer = notice.writer || '';
      const tagDisplay = tag ? `[${tag}]` : '';

      return `
        <div class="notice-item">
          <div class="${titleClass}">${escapeHTML(titleText)}</div>
          <div class="notice-tag ${titleClass}">${tagDisplay}</div>
          <p class="notice-body">${decodedContent}</p>
          <div class="notice-writer">${escapeHTML(writer)}</div>
          <div class="notice-time">${timeStr}</div>
        </div>
      `;
    }

    // 主题跟随（与核心一致）
    function applyTheme() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const themeLink = document.getElementById('theme-link');
      if (themeLink) {
        themeLink.href = isDark ? './main/theme-dark.css' : './main/theme-light.css';
      }
    }
    applyTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

    loadAllNotices();
  </script>
</body>
</html>
