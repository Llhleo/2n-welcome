<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>[2n] 公会 · 调试版 (Console)</title>

  <!-- 禁止浏览器缓存本页面 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- 嵌入 Eruda 手机调试工具 -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

  <script>
    // 动态加载基础样式和主题，带上时间戳防止缓存
    (function() {
      var timestamp = Date.now();
      document.write('<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">');
      document.write('<link rel="stylesheet" href="./main/base.css?v=' + timestamp + '">');
      document.write('<link rel="stylesheet" href="./main/components.css?v=' + timestamp + '">');
      document.write('<link rel="stylesheet" id="theme-link" href="./main/theme-light.css?v=' + timestamp + '">');
    })();
  </script>

  <script>
    // 初始化 Eruda（页面加载完成后）
    window.addEventListener('load', function() {
      eruda.init({
        tool: ['console', 'elements', 'network', 'resources', 'info', 'sources'],
        defaults: {
          displaySize: 50,
          theme: 'Monokai'
        }
      });
      console.log('[Eruda] 调试面板已加载，点击右下角悬浮球打开');
    });
  </script>
</head>
<body>
<div class="page">
  <div class="header-row">
    <div class="main-title" id="guildTitle">加载中...</div>
    <div id="userAreaContainer"></div>
  </div>

  <div class="leaders">
    <div class="leader-card">
      <div class="leader-emoji">🥇</div>
      <div class="leader-label" id="leaderLabel1">会长</div>
      <div class="leader-name">awdc</div>
    </div>
    <div class="leader-card">
      <div class="leader-emoji">🥈</div>
      <div class="leader-label" id="leaderLabel2">副会长</div>
      <div class="leader-name">flowerwsr</div>
    </div>
  </div>

  <!-- ... 页面主体结构保持不变 ... -->

  <div class="footer">
    <div class="version">Version 0.5.3</div>
    <div class="copyright"><i class="far fa-copyright"></i> Copyright 2026 GitHub@pythonWsr Florrio@flowerwsr</div>
  </div>
</div>

<div class="toast-tip" id="copyToast">📋 已复制</div>

<!-- 动态加载调试脚本 -->
<script>
  (function() {
    const urlParams = new URLSearchParams(window.location.search);
    const user = urlParams.get('user');
    if (!user) return;

    function loadScript(src) {
      const script = document.createElement('script');
      script.src = src + '?v=' + Date.now();
      script.defer = true;
      document.head.appendChild(script);
    }

    if (user === 'debug') {
      loadScript('./main/developers/debug.js');
    } else if (user === 'dev') {
      loadScript('./main/developers/dev.js');
    } else if (user === 'admin') {
      loadScript('./main/developers/admin.js');
    }
  })();
</script>

<!-- 动态加载主逻辑脚本（带时间戳） -->
<script>
  (function() {
    var timestamp = Date.now();
    document.write('<script type="module" src="./main/core.js?v=' + timestamp + '"><\/script>');
  })();
</script>

<!-- 渲染用户区域 -->
<script type="module">
  import { renderUserArea } from './main/settings.js';
  renderUserArea(document.getElementById('userAreaContainer'));
</script>

<!-- 问卷加载 -->
<script type="module">
  import * as pipe from './main/pipe.js';
  import { renderSurvey } from './data/survey.js';

  const user = pipe.getUrlParam('user');
  if (user) {
    const containerDesktop = document.getElementById('surveyContainerDesktop');
    const containerMobile = document.getElementById('surveyContainerMobile');
    renderSurvey(containerDesktop, user, false);
    renderSurvey(containerMobile, user, true);
  }
</script>
</body>
</html>
